name: Build the GoopKOS program

# Run by hand from the Actions tab to get test builds, or push a tag like
# helper-v0.1.0 to build and publish them as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["helper-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: goopkos-helper-win-x64
          - os: macos-latest        # Apple silicon (M1 and newer)
            asset: goopkos-helper-mac-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm helper:build

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/helper/${{ matrix.asset }}.exe -DestinationPath ${{ matrix.asset }}.zip
      - name: Zip (Mac)
        if: runner.os == 'macOS'
        working-directory: dist/helper
        run: zip ../../${{ matrix.asset }}.zip ${{ matrix.asset }}   # zip keeps the "can run" permission

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/helper-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
